[package]
name = "oops-editor"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "oops_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-store = "2.2.0"
portable-pty = "0.8"
once_cell = "1"
parking_lot = "0.12"
anyhow = "1"
base64 = "0.22"

[profile.dev]
incremental = true
opt-level = 0

[profile.release]
strip = true
# 使用 "thin" LTO 可以在保证性能的同时大幅提升构建速度（默认 true 为 "fat" LTO，极其缓慢）
lto = "thin"
# 增加编译单元数量以允许更高级别的并行编译（默认 1 会限制为单线程优化，极其缓慢）
codegen-units = 16
# 优化级别保持 3 以确保运行性能
opt-level = 3
