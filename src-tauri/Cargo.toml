[package]
name = "oops-editor"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "oops_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-store = "2.2.0"
portable-pty = "0.8"
once_cell = "1"
parking_lot = "0.12"
anyhow = "1"

[profile.dev]
incremental = true
opt-level = 0

[profile.release]
strip = true
lto = true
codegen-units = 1
