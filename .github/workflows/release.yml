# ============================================================
# Release workflow
# push to main 或手动触发时自动构建并发布 Windows 包
# macOS 构建已禁用
# ============================================================
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.1.28). Empty = auto patch bump"
        required: false
        type: string

permissions:
  contents: write

# ── 并发控制 ──────────────────────────────────────────────
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 版本号同步 ──────────────────────────────────────────
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm

      - id: v
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            # Auto bump patch version on push or empty dispatch
            CURRENT=$(node -p "require('./package.json').version")
            VERSION=$(node -p "
              const [maj,min,patch] = '$CURRENT'.split('.').map(Number);
              \`\${maj}.\${min}.\${patch+1}\`
            ")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Sync version in files
        run: node scripts/sync-version.js "${{ steps.v.outputs.version }}"

      - name: Commit and push version bump
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "v${{ steps.v.outputs.version }} [skip ci]"
            git push origin HEAD:"${{ github.ref_name }}"
          fi

  # ── Windows 构建 + 发布 ────────────────────────────────
  build-and-release:
    needs: version
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Rust 工具链 ──────────────────────────────────────
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      # ── Node.js ──────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install frontend dependencies
        run: pnpm install

      - name: Sync version to ${{ needs.version.outputs.version }}
        run: pnpm exec node scripts/sync-version.js "${{ needs.version.outputs.version }}"

      # ── 构建 Tauri 应用 ──────────────────────────────────
      - name: Build Tauri Windows bundles
        run: pnpm tbuild -- --bundles msi

      # ── 收集构建产物 ─────────────────────────────────────
      - name: Locate Tauri bundles
        id: bundles
        shell: bash
        run: |
          BUNDLE_DIR="src-tauri/target/release/bundle"
          echo "Bundles root: $BUNDLE_DIR"
          ls -lhR "$BUNDLE_DIR" || echo "No bundle dir found"

          ASSETS=$(find "$BUNDLE_DIR" -type f \( \
            -name "*.msi" -o \
            -name "*.exe" \
          \) | tr "\n" " ")
          echo "assets=$ASSETS" >> "$GITHUB_OUTPUT"
          echo "Found artifacts: $ASSETS"

      # ── 创建 GitHub Release ──────────────────────────────
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: ${{ steps.bundles.outputs.assets }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
