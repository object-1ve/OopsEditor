# =============================================================================
# Build and Release — triggered ONCE per tag push (v*), never on branch push.
# =============================================================================
# Design rationale (following GitHub official guidance):
#   on.push.tags        – runs ONLY when a matching tag is pushed, not on
#                         branch commits or PRs. One tag = one workflow run.
#   softprops/action-gh-release@v3 – the de-facto standard action wrapping the
#                         GitHub Releases API (successor to the deprecated
#                         actions/create-release). Node 24 runtime.
#   generate_release_notes:true – auto-generates notes from merged PRs / commits
#                         (GitHub's built-in release notes generator).
# =============================================================================

name: Build and Release

on:
  push:
    tags:
      - 'v*'             # matches v-prefixed tags, e.g. v0.1.29 — one run per tag.
  workflow_dispatch:    # allow manual trigger from Actions tab

# ── Permissions ──────────────
permissions:
  contents: write       # required by softprops/action-gh-release to create the
                        # release and upload assets.

# ── Environment ──────────────────────────────────────────────────────────────
env:
  CARGO_TERM_COLOR: always

# ── Jobs ─────────────────────────────────────────────────────────────────────
jobs:

  # ── Build (Windows x64) ─────────────────────────────────────────────────────
  build:
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Rust toolchain ──────────────────────────────────────────────────
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ── Node.js + pnpm ──────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Sync version from git tag
        run: node .github/scripts/sync-version.mjs

      # ── Tests ───────────────────────────────────────────────────────────
      - name: Run Rust unit tests
        run: cargo test
        working-directory: src-tauri

      # ── Build ───────────────────────────────────────────────────────────
      - name: Build Tauri application (MSI)
        run: pnpm tbuild --bundles msi

      # ── Upload build artifacts ──────────────────────────────────────────
      # 多路径上传会保留目录层级,release 步骤必须用 **/ 递归 glob 取包。
      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: OopsEditor-Windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.sig
            src-tauri/target/release/bundle/msi/*.zip
            src-tauri/target/release/bundle/msi/*.zip.sig
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/nsis/*.zip
            src-tauri/target/release/bundle/nsis/*.zip.sig
          if-no-files-found: error
  # ── Build (macOS ARM64) ──────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Rust toolchain ──
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ── Node.js + pnpm ──────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Sync version from git tag
        run: node .github/scripts/sync-version.mjs

      # ── Tests ───────────────────────────────────────────────────────────
      - name: Run Rust unit tests
        run: cargo test
        working-directory: src-tauri

      # ── Build ───────────────────────────────────────────────────────────
      - name: Build Tauri application (DMG)
        run: pnpm tbuild --bundles dmg

      # ── Upload build artifacts ──────────────────────────────────────────
      # 多路径上传会保留目录层级,release 步骤必须用 **/ 递归 glob 取包。
      - name: Upload DMG installer
        uses: actions/upload-artifact@v4
        with:
          name: OopsEditor-macOS
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/dmg/*.sig
            src-tauri/target/release/bundle/macos/*.tar.gz
            src-tauri/target/release/bundle/macos/*.sig
          if-no-files-found: error

  # ── Release (after all builds succeed) ───────────────────────────────────────
  release:
    needs: [build, build-macos]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download MSI installer
        uses: actions/download-artifact@v4
        with:
          name: OopsEditor-Windows

      - name: Download DMG installer
        uses: actions/download-artifact@v4
        with:
          name: OopsEditor-macOS

      - name: List release assets
        run: find . -maxdepth 4 -type f | sort

      # updater 通道:用带签名的安装包拼装 latest.json(无签名包时脚本 exit 1 直接爆红)。
      - name: Generate latest.json for updater
        run: node .github/scripts/gen-latest-json.mjs ${{ github.ref_name }}

      # 发布正文由 release-body.mjs 从 git 提交历史自动生成(上一个标签..当前标签),
      # 无需手动维护 CHANGELOG。脚本把正文写入临时文件,再用 body_path 指定。
      - name: Generate release body from git history
        run: node .github/scripts/release-body.mjs ${{ github.ref_name }} release_body.md

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          # body_path 指定 release-body.mjs 生成的正文;generate_release_notes 追加自动生成的对比链接。
          body_path: release_body.md
          files: |
            **/*.msi
            **/*.msi.sig
            **/*.dmg
            **/*.zip
            **/*.zip.sig
            **/*.tar.gz
            **/*.tar.gz.sig
            **/*.sig
            **/latest.json
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
