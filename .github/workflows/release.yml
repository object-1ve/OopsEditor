# ============================================================
# Release workflow
# 通过 push tag（如 v0.1.27）触发，构建并发布 GitHub Release
# 一次 push 只会运行一次 action（concurrency 控制）
# ============================================================
name: Release

on:
  push:
    tags:
      # 匹配 v 开头、后接数字的 tag，如 v0.1.27、v1.2.3-beta
      - "v[0-9]+*"

# ── 并发控制 ──────────────────────────────────────────────
# 同一次 push 即使包含多个 tag，也只保留一个运行中的 workflow
# 正在运行的会被取消，队列中的被跳过，保证 release 是线性的
concurrency:
  group: release
  cancel-in-progress: true

jobs:
  # ── Windows 构建 + 发布 ────────────────────────────────
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: ⏬ Checkout repository
        uses: actions/checkout@v4

      # ── Rust 工具链 ──────────────────────────────────────
      - name: ⚙️ Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # ── Node.js ──────────────────────────────────────────
      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: 📦 Install frontend dependencies
        run: npm ci

      # ── 构建 Tauri 应用 ──────────────────────────────────
      - name: 🔨 Build Tauri app
        run: npm run tauri build

      # ── 收集构建产物 ─────────────────────────────────────
      - name: 📁 Locate Tauri bundles
        id: bundles
        shell: bash
        run: |
          # Tauri v2 打包产物
          BUNDLE_DIR="src-tauri/target/release/bundle"
          echo "Bundles root: $BUNDLE_DIR"
          ls -lhR "$BUNDLE_DIR" || echo "No bundle dir found"

          # Windows → .msi / .exe (nsis)
          ASSETS=$(find "$BUNDLE_DIR" -type f \( \
            -name "*.msi" -o \
            -name "*.exe" \
          \) | tr "\n" " ")
          echo "assets=$ASSETS" >> "$GITHUB_OUTPUT"
          echo "Found artifacts: $ASSETS"

      # ── 创建 GitHub Release ──────────────────────────────
      - name: 🚀 Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: ${{ steps.bundles.outputs.assets }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
