# =============================================================================
# Build and Release — triggered ONCE per tag push (v*), never on branch push.
# =============================================================================
# Design rationale (following GitHub official guidance):
#   on.push.tags        – runs ONLY when a matching tag is pushed, not on
#                         branch commits or PRs. One tag = one workflow run.
#   softprops/action-gh-release@v3 – the de-facto standard action wrapping the
#                         GitHub Releases API (successor to the deprecated
#                         actions/create-release). Node 24 runtime.
#   generate_release_notes:true – auto-generates notes from merged PRs / commits
#                         (GitHub's built-in release notes generator).
# =============================================================================

name: Build and Release

on:
  push:
    tags:
      - 'v*'             # matches v-prefixed tags, e.g. v0.1.29 — one run per tag.
  workflow_dispatch:    # allow manual trigger from Actions tab

# ── Permissions ──────────────
permissions:
  contents: write       # required by softprops/action-gh-release to create the
                        # release and upload assets.

# ── Environment ──────────────────────────────────────────────────────────────
env:
  CARGO_TERM_COLOR: always

# ── Jobs ─────────────────────────────────────────────────────────────────────
jobs:

  # ── Build (Windows x64) ─────────────────────────────────────────────────────
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Rust toolchain ──────────────────────────────────────────────────
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ── Node.js + pnpm ──────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      # ── Tests ───────────────────────────────────────────────────────────
      - name: Run Rust unit tests
        run: cargo test
        working-directory: src-tauri

      # ── Build ───────────────────────────────────────────────────────────
      - name: Build Tauri application (MSI)
        run: pnpm tbuild --bundles msi

      # ── Upload build artifacts ──────────────────────────────────────────
      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: OopsEditor-Windows
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

  # ── Build (macOS ARM64) ──────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Rust toolchain ──
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ── Node.js + pnpm ──────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      # ── Tests ───────────────────────────────────────────────────────────
      - name: Run Rust unit tests
        run: cargo test
        working-directory: src-tauri

      # ── Build ───────────────────────────────────────────────────────────
      - name: Build Tauri application (DMG)
        run: pnpm tbuild --bundles dmg

      # ── Upload build artifacts ──────────────────────────────────────────
      - name: Upload DMG installer
        uses: actions/upload-artifact@v4
        with:
          name: OopsEditor-macOS
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn

  # ── Release (after all builds succeed) ───────────────────────────────────────
  release:
    needs: [build, build-macos]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download MSI installer
        uses: actions/download-artifact@v4
        with:
          name: OopsEditor-Windows

      - name: Download DMG installer
        uses: actions/download-artifact@v4
        with:
          name: OopsEditor-macOS

      - name: List release assets
        run: ls -lh

      # Extract only the changelog section matching this tag (e.g. v0.1.41 ->
      # "## [0.1.41]"). Pasting the whole CHANGELOG.md made every release show
      # stale old entries; with generate_release_notes:true GitHub still appends
      # the auto-generated "Full Changelog" comparison link at the bottom.
      - name: Extract changelog section for this version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="[$VERSION]" '
            /^## / { if (in_section) exit; if (index($0, ver) > 0) in_section = 1; next }
            in_section { print }
          ' CHANGELOG.md > RELEASE_NOTES.md

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          # Empty when no changelog section exists for this version, so GitHub
          # falls back to its auto-generated release notes.
          body_path: RELEASE_NOTES.md
          files: |
            *.msi
            *.dmg
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: false
