name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "version (leave empty for auto patch bump)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: tauri-release-${{ github.ref }}
  cancel-in-progress: true

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  sync-version:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    outputs:
      version: ${{ steps.sync.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: sync
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT_VERSION="${{ github.event.inputs.version }}"
            if [ -n "$INPUT_VERSION" ]; then
              node scripts/sync-version.js "$INPUT_VERSION"
              echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
            else
              CURRENT=$(node -p "require('./package.json').version")
              NEW=$(node -p """
                const [maj,min,patch] = '$CURRENT'.split('.').map(Number);
                \`\${maj}.\${min}.\${patch+1}\`
              """)
              node scripts/sync-version.js "$NEW"
              echo "version=$NEW" >> "$GITHUB_OUTPUT"
            fi
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          else
            CURRENT=$(node -p "require('./package.json').version")
            echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit and tag version bump
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "v${{ steps.sync.outputs.version }}"
          git tag "v${{ steps.sync.outputs.version }}"
          git push origin HEAD --tags

  build-macos:
    runs-on: macos-latest
    needs: sync-version
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - name: Install frontend dependencies
        run: npm ci
      - name: Install native Rollup
        shell: bash
        run: |
          ROLLUP_VERSION=$(node -p "require('./node_modules/rollup/package.json').version")
          ARCH=$(node -p "process.arch === 'arm64' ? 'arm64' : 'x64'")
          npm install --no-save "@rollup/rollup-darwin-${ARCH}@${ROLLUP_VERSION}"
      - name: Install Tauri CLI native binding
        shell: bash
        run: |
          ARCH=$(node -p "process.arch === 'arm64' ? 'arm64' : 'x64'")
          npm install --no-save "@tauri-apps/cli-darwin-${ARCH}@2.11.2"
      - name: Verify Tauri CLI
        run: npx tauri info
      - name: Build Tauri macOS bundles
        run: |
          # 如果没有配置 Apple 证书签名
          if [ -z "$APPLE_CERTIFICATE" ] && [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "No Apple signing cert configured, skipping codesign"
            npm run tbuild -- --bundles dmg
          else
            npm run tbuild -- --bundles app,dmg
          fi
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OopsEditor-macos-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 90
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg

  build-windows:
    runs-on: windows-latest
    needs: sync-version
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Tauri CLI native binding
        run: npm install --no-save @tauri-apps/cli-win32-x64-msvc@2.11.2
      - name: Verify Tauri CLI
        run: npx tauri info
      - name: Build Tauri Windows bundles
        run: npm run tbuild -- --bundles msi
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OopsEditor-windows-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 90
          path: |
            src-tauri/target/release/bundle/msi/*.msi

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [build-macos, build-windows]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: OopsEditor-*
          merge-multiple: true
          path: release-artifacts
      - name: List release artifacts
        run: ls -laR release-artifacts/
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-artifacts/**
