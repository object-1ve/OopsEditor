name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.1.24). Empty = auto patch bump"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: tauri-release-${{ github.ref }}
  cancel-in-progress: true

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  # ──────────────────────────────
  # Version sync
  # ──────────────────────────────
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 21

      - name: Install pnpm
        run: npm install -g pnpm

      - id: v
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            # Auto bump patch version on push or empty dispatch
            CURRENT=$(node -p "require('./package.json').version")
            VERSION=$(node -p """
              const [maj,min,patch] = '$CURRENT'.split('.').map(Number);
              \`\${maj}.\${min}.\${patch+1}\`
            """)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Sync version in files
        run: node scripts/sync-version.js "${{ steps.v.outputs.version }}"

      - name: Commit and push version bump
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "v${{ steps.v.outputs.version }} [skip ci]"
            git push origin HEAD:"${{ github.ref_name }}"
          fi

  # ──────────────────────────────
  # macOS build
  # ──────────────────────────────
  build-macos:
    needs: version
    runs-on: macos-latest
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 21

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install frontend dependencies
        run: pnpm install

      - name: Sync version to ${{ needs.version.outputs.version }}
        run: pnpm exec node scripts/sync-version.js "${{ needs.version.outputs.version }}"



      - name: Build Tauri macOS bundles
        shell: bash
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] && [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "No Apple signing cert configured, skipping codesign"
            pnpm tbuild -- --bundles dmg
          else
            pnpm tbuild -- --bundles app,dmg
          fi

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OopsEditor-macos-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 90
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg

  # ──────────────────────────────
  # Windows build
  # ──────────────────────────────
  build-windows:
    needs: version
    runs-on: windows-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 21

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install frontend dependencies
        run: pnpm install

      - name: Sync version to ${{ needs.version.outputs.version }}
        run: pnpm exec node scripts/sync-version.js "${{ needs.version.outputs.version }}"



      - name: Build Tauri Windows bundles
        run: pnpm tbuild -- --bundles msi

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OopsEditor-windows-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 90
          path: |
            src-tauri/target/release/bundle/msi/*.msi

  # ──────────────────────────────
  # Create GitHub release
  # ──────────────────────────────
  release:
    runs-on: ubuntu-latest
    needs: [build-macos, build-windows]
    if: |
      always()
      && needs.build-macos.result == 'success'
      && needs.build-windows.result == 'success'
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: OopsEditor-*
          merge-multiple: true
          path: release-artifacts

      - name: List release artifacts
        run: ls -laR release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: release-artifacts/**
